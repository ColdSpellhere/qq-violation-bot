name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip check
      - name: Generate non-tracked test group ID
        run: |
          while :; do
            value="$(python -c 'import secrets; print(secrets.randbelow(900000000)+100000000)')"
            if ! git grep -q "$value"; then
              echo "TARGET_GROUP_ID=$value" >> "$GITHUB_ENV"
              break
            fi
          done
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q bot.py plugins scripts tests
      - run: python scripts/check_public_tree.py
      - name: Scan every commit introduced by this change
        env:
          SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ ! "$SCAN_BASE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Missing or invalid scan base" >&2
            exit 1
          fi
          if [[ "$SCAN_BASE" == "0000000000000000000000000000000000000000" ]]; then
            python scripts/check_public_tree.py --history
          else
            git cat-file -e "$SCAN_BASE^{commit}"
            python scripts/check_public_tree.py --range "$SCAN_BASE..HEAD"
          fi
